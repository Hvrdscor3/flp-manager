name: Release

# Publica una version nueva: git tag v1.0.1 && git push origin v1.0.1
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: python -m pip install pyinstaller pywebview

      - name: Version y repositorio desde el tag
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          @"
          VERSION = "$v"
          REPO = "${{ github.repository }}"
          ASSET = "FLP-Manager.exe"
          "@ | Set-Content -Encoding utf8 manager/version.py

      - name: Compilar
        shell: cmd
        run: build_exe.bat

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FLP-Manager.exe
          generate_release_notes: true
